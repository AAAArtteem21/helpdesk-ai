x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-key}
  DEBUG: ${DEBUG:-0}
  POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
  POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
  POSTGRES_HOST: db
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
  LLM_RPM: ${LLM_RPM:-60}
  LLM_CONCURRENCY: ${LLM_CONCURRENCY:-30}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-6}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  SEND_TIMEOUT: ${SEND_TIMEOUT:-10}
  SEND_MAX_ATTEMPTS: ${SEND_MAX_ATTEMPTS:-8}
  SEND_CONCURRENCY: ${SEND_CONCURRENCY:-20}
  ENABLE_SIM_API: "1"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_kb && gunicorn config.wsgi -b 0.0.0.0:8000 -w 4"
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    build: .
    command: python manage.py run_worker
    environment: *app-env
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mock-helpdesk:
        condition: service_started

  mock-helpdesk:
    build: .
    command: python mock_helpdesk/server.py
    ports:
      - "9000:9000"
    environment:
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0.2}
      MOCK_SLOW_RATE: ${MOCK_SLOW_RATE:-0.1}
      MOCK_SLOW_SECONDS: ${MOCK_SLOW_SECONDS:-15}
      MOCK_DEDUP: ${MOCK_DEDUP:-1}
    restart: unless-stopped

volumes:
  pgdata: